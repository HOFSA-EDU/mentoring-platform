name: ${COMPOSE_PROJECT_NAME:-bts-mentoring-platform-production}

x-database-url: &database-url "postgresql://${POSTGRES_USER:-mentoring}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@postgres:5432/${POSTGRES_DB:-mentoring}?schema=public"

x-tools: &tools
  image: bts-mentoring-platform-tools:${IMAGE_TAG:-local}
  build:
    context: .
    target: tools
  init: true
  restart: "no"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mentoring}
      POSTGRES_USER: ${POSTGRES_USER:-mentoring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    # Internal only; no database port is published to the host.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    <<: *tools
    environment:
      DATABASE_URL: *database-url
    command: ["npm", "run", "db:deploy"]

  app:
    image: bts-mentoring-platform:${IMAGE_TAG:-local}
    build:
      context: .
      target: runner
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env.docker (at least 32 characters)}
      AUTH_URL: ${AUTH_URL:?Set AUTH_URL in .env.docker to the public origin}
      AUTH_TRUST_HOST: "true"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Explicit opt-in; never runs automatically with `up`.
  bootstrap:
    <<: *tools
    profiles: ["tools"]
    environment:
      DATABASE_URL: *database-url
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    command: ["npm", "run", "db:bootstrap"]

volumes:
  postgres-data:
